[package]
name = "xodus-ps5-native"
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "=0.2.189"
msixvc = { path = "../msixvc" }
msixvc-common = { path = "../msixvc-common" }

xodus-cli = { path = "../xodus-cli", default-features = false, optional = true }

tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.27.0"
fs2 = "0.4.3"

[features]
job-engine = ["dep:xodus-cli", "dep:tokio"]
