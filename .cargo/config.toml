# See https://docs.rs/aes/0.9.1/aes/#supported-backends
# and https://github.com/xodus-gaming/xodus/pull/60

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-Ctarget-feature=+aes,+ssse3"]

[target.'cfg(target_arch = "aarch64")']
rustflags = ["-Ctarget-feature=+aes"]

# Keep routine host development/test artifacts small on the development Mac.
# PS5 release builds retain their separate native build configuration.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
